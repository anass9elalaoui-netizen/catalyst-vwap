<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Catalyst VWAP: intraday volume on a normal day versus a filing day">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1A33"/>
      <stop offset="1" stop-color="#12305C"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" rx="18" fill="url(#bg)"/>

  <!-- Title block -->
  <text x="64" y="128" fill="#FFFFFF" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="58" font-weight="700">Catalyst VWAP</text>
  <text x="66" y="174" fill="#A9C1E6" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22">Grounded LLM reading of company filings</text>
  <text x="66" y="204" fill="#A9C1E6" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22">→ abnormal-volume forecast → event-aware VWAP</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15">
    <rect x="66" y="236" width="118" height="30" rx="15" fill="#1D4F91"/>
    <text x="125" y="256" fill="#FFFFFF" text-anchor="middle">SEC 8-K data</text>
    <rect x="194" y="236" width="104" height="30" rx="15" fill="#1D4F91"/>
    <text x="246" y="256" fill="#FFFFFF" text-anchor="middle">Guardrails</text>
    <rect x="308" y="236" width="138" height="30" rx="15" fill="#1D4F91"/>
    <text x="377" y="256" fill="#FFFFFF" text-anchor="middle">Back-test + TCA</text>
  </g>

  <!-- Chart: intraday volume, normal day vs filing day (illustrative shape, not data) -->
  <g transform="translate(700,0)">
    <line x1="0" y1="270" x2="520" y2="270" stroke="#3B5D8F" stroke-width="1.5"/>
    <!-- filing day (orange, behind) -->
    <g fill="#F59E0B" fill-opacity="0.85">
      <rect x="6"   y="110" width="30" height="160" rx="3"/>
      <rect x="46"  y="160" width="30" height="110" rx="3"/>
      <rect x="86"  y="190" width="30" height="80"  rx="3"/>
      <rect x="126" y="210" width="30" height="60"  rx="3"/>
      <rect x="166" y="220" width="30" height="50"  rx="3"/>
      <rect x="206" y="226" width="30" height="44"  rx="3"/>
      <rect x="246" y="230" width="30" height="40"  rx="3"/>
      <rect x="286" y="230" width="30" height="40"  rx="3"/>
      <rect x="326" y="228" width="30" height="42"  rx="3"/>
      <rect x="366" y="224" width="30" height="46"  rx="3"/>
      <rect x="406" y="216" width="30" height="54"  rx="3"/>
      <rect x="446" y="204" width="30" height="66"  rx="3"/>
      <rect x="486" y="175" width="30" height="95"  rx="3"/>
    </g>
    <!-- normal day (blue, front, narrower) -->
    <g fill="#60A5FA">
      <rect x="14"  y="200" width="14" height="70" rx="2"/>
      <rect x="54"  y="222" width="14" height="48" rx="2"/>
      <rect x="94"  y="232" width="14" height="38" rx="2"/>
      <rect x="134" y="238" width="14" height="32" rx="2"/>
      <rect x="174" y="242" width="14" height="28" rx="2"/>
      <rect x="214" y="244" width="14" height="26" rx="2"/>
      <rect x="254" y="245" width="14" height="25" rx="2"/>
      <rect x="294" y="244" width="14" height="26" rx="2"/>
      <rect x="334" y="241" width="14" height="29" rx="2"/>
      <rect x="374" y="236" width="14" height="34" rx="2"/>
      <rect x="414" y="228" width="14" height="42" rx="2"/>
      <rect x="454" y="215" width="14" height="55" rx="2"/>
      <rect x="494" y="190" width="14" height="80" rx="2"/>
    </g>
    <!-- 8-K marker -->
    <line x1="21" y1="70" x2="21" y2="106" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="21" y="62" fill="#F59E0B" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle">8-K filed</text>
    <!-- legend -->
    <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#C9D8EE">
      <rect x="300" y="52" width="14" height="14" rx="2" fill="#60A5FA"/>
      <text x="322" y="64">normal day</text>
      <rect x="410" y="52" width="14" height="14" rx="2" fill="#F59E0B"/>
      <text x="432" y="64">filing day</text>
      <text x="0" y="294" fill="#7F9AC2" font-size="13">09:30</text>
      <text x="520" y="294" fill="#7F9AC2" font-size="13" text-anchor="end">16:00</text>
      <text x="260" y="294" fill="#7F9AC2" font-size="13" text-anchor="middle">intraday volume (illustration)</text>
    </g>
  </g>
</svg>
